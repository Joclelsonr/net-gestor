version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./app
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      DATABASE_URL: postgres://postgres:postgres@db:5432/netgestor
    command: npm run dev -- --hostname 0.0.0.0 --webpack
    init: true
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: netgestor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  node_modules:
  postgres_data: