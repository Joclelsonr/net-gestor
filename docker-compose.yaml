version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./app
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0 --webpack
    init: true
    restart: unless-stopped

volumes:
  node_modules: