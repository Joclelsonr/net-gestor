
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-app
    working_dir: /workspace
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - node_modules:/workspace/app/node_modules
      - next_cache:/workspace/app/.next
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
